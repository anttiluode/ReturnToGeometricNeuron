name: Ideal-chain experiment
on:
  push:
    paths:
      - ".github/workflows/ideal-chain.yml"
      - "experiments/ideal_chain.py"
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Check existing tests
        run: python -m unittest discover -s tests -v
      - name: Run paired ideal chain and control comparison
        run: python experiments/ideal_chain.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ideal-chain-results
          path: results/ideal_chain.json
          if-no-files-found: ignore
