name: Tap-learning round 5
on:
  push:
    paths:
      - ".github/workflows/tap-learning.yml"
      - "experiments/tap_learning_round5.py"
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Existing regression tests
        run: python -m unittest discover -s tests -v
      - name: Learned connectivity and sixteen-tap filter controls
        run: python experiments/tap_learning_round5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tap-learning-round5
          path: results/tap_learning_round5.json
          if-no-files-found: ignore
